<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Glamora Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FAF8F4;--ink:#1F1F1F;--beige:#EDE5DA;--gold:#B89B72;--mute:#77736E;--line:#e5ddd0;--bad:#a03b32;--good:#3d6b4a;--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:500;font-size:13px;transition:.2s}
.btn:hover{background:var(--gold);border-color:var(--gold)}.btn.ghost{background:#fff;color:var(--ink)}.btn.ghost:hover{background:var(--beige);border-color:var(--ink)}.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:var(--bad);color:#fff}.btn.sm{padding:6px 12px;font-size:12px}.btn[disabled]{opacity:.55;cursor:wait}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:24px}.lgc{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);padding:44px 38px;box-shadow:0 24px 60px rgba(60,45,30,.1)}
.mark{font-family:var(--serif);letter-spacing:.16em;font-size:26px;text-align:center;margin-bottom:26px}.lgc h1{font-size:30px;text-align:center}.lgc p.s{text-align:center;color:var(--mute);margin:8px 0 28px}
/* shell */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.side .mark{text-align:left;font-size:21px;margin:0 8px 26px}
.nav a,.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:2px;border:0;background:none;color:var(--ink);font-size:14px;text-align:left;border-left:2px solid transparent}
.nav a:hover,.nav button:hover{background:var(--ivory)}.nav a.on{background:var(--beige);border-left-color:var(--gold);font-weight:500}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;flex:none}
.main{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 32px;border-bottom:1px solid var(--line);background:#fff}
.burger{display:none;background:none;border:1px solid var(--line);padding:6px 10px}
.crumb{color:var(--mute);font-size:13px}.crumb a:hover{color:var(--gold)}
.page{padding:32px;max-width:1200px}.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}.ph h1{font-size:32px}
.card{background:#fff;border:1px solid var(--line);padding:24px;margin-bottom:20px}.card h3{font-size:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);padding:20px}.stat b{font:400 34px var(--serif);display:block}.stat span{color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500;background:#fcfbf8}
.tw{overflow-x:auto;border:1px solid var(--line)}.thumb{width:44px;height:56px;object-fit:cover;background:var(--beige);display:block}
.badge{display:inline-block;padding:2px 10px;font-size:12px;background:var(--beige)}.badge.published,.badge.replied{background:#e3efe6;color:var(--good)}.badge.draft,.badge.new{background:#f7ecd2;color:#8a6a1c}.badge.archived{background:#eee;color:var(--mute)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.bar input,.bar select{padding:9px 12px;border:1px solid var(--line);background:#fff;font:inherit;min-width:150px}
.pg{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px;color:var(--mute)}
.empty{text-align:center;padding:50px 20px;color:var(--mute);background:#fff;border:1px solid var(--line)}
/* forms */
.f{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fld{display:flex;flex-direction:column;gap:6px}.fld.full{grid-column:1/-1}
.fld>label{font-weight:500;font-size:13px}.fld .help{color:var(--mute);font-size:12px}.fld .err{color:var(--bad);font-size:12px}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=datetime-local],select,textarea{width:100%;padding:10px 12px;border:1px solid #d6cdbf;background:#fff;font:inherit;border-radius:0}
textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,155,114,.25)}.bad{border-color:var(--bad)!important}
.sw{display:flex;align-items:center;gap:10px}.sw input{width:18px;height:18px;accent-color:var(--gold)}
.imgf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.imgf img{width:84px;height:100px;object-fit:cover;background:var(--beige)}.imgs{display:flex;gap:10px;flex-wrap:wrap}.imgs .it{position:relative}.imgs .it button{position:absolute;top:2px;right:2px;background:#fff;border:1px solid var(--line);width:22px;height:22px;line-height:1}
.blk{border:1px solid var(--line);padding:12px;margin-bottom:10px;background:#fcfbf8}.blk .row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}.blk select{width:auto}
.fa{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
/* media */
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.mc{background:#fff;border:1px solid var(--line)}.mc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--beige)}.mc .m{padding:10px;font-size:12px;color:var(--mute);word-break:break-all}.mc .a{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}.pick{cursor:pointer}.pick:hover{outline:2px solid var(--gold)}
/* modal/toast */
.mo{position:fixed;inset:0;background:rgba(31,31,31,.5);display:grid;place-items:center;z-index:50;padding:20px}.md{background:#fff;max-width:880px;width:100%;max-height:90vh;overflow:auto;padding:26px}.md h3{margin-bottom:14px;font-size:22px}.md .fa{justify-content:flex-end}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 20px;z-index:99;max-width:340px}.toast.bad{background:var(--bad)}.toast.good{background:var(--good)}
.prev{font:18px/1.8 var(--sans)}.prev h2{font-family:var(--serif);font-size:28px;margin:30px 0 10px}.prev img{max-width:100%}
.msgb{white-space:pre-wrap;background:var(--ivory);padding:14px;border:1px solid var(--line)}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;z-index:40;width:260px;transform:translateX(-100%);transition:.3s}.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}.burger{display:block}.page{padding:20px 16px}.top{padding:14px 16px}.f{grid-template-columns:1fr}}
</style></head>
<body><div id="root"></div>
<script>
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const ICON={dash:'M3 12l9-8 9 8M5 10v10h14V10',prod:'M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2',col:'M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v6H4zM13 14h7v6h-7z',cat:'M4 6h16M4 12h16M4 18h10',home:'M3 11l9-7 9 7v9H3z',page:'M6 3h9l4 4v14H6zM14 3v5h5',blog:'M5 4h14v16H5zM8 9h8M8 13h8M8 17h5',media:'M4 5h16v14H4zM4 15l5-5 5 5 3-3 3 3',msg:'M4 6h16v12H4zM4 7l8 6 8-6',set:'M12 8a4 4 0 100 8 4 4 0 000-8zM4 12h2M18 12h2M12 4v2M12 18v2',key:'M14 10a4 4 0 10-3 4l2 2h2v2h2v-2h1v-3zM9 9h.01',out:'M10 4H4v16h6M14 8l4 4-4 4M8 12h10'};
const ico=n=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',ICON[n]);s.append(p);return s};
const money=n=>n==null?'':'Rs. '+Number(n).toLocaleString('en-PK');
const fdate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
let toastT;function toast(msg,type){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=h('div',{class:'toast '+(type||''),role:'status'},msg);document.body.append(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3800)}
async function api(method,url,body,raw){
  const o={method,headers:{'X-Requested-With':'glamora-admin'},credentials:'same-origin'};
  if(raw){o.body=raw;o.headers['Content-Type']='application/octet-stream'}else if(body!==undefined){o.body=JSON.stringify(body);o.headers['Content-Type']='application/json'}
  let r;try{r=await fetch('/api/admin'+url,o)}catch(_){return{ok:false,status:0,data:{error:'Cannot reach the server.'}}}
  let data={};try{data=await r.json()}catch(_){}
  if(r.status===401&&url!=='/me'&&!url.startsWith('/login')&&location.pathname!=='/admin/login'){go('/admin/login')}
  return{ok:r.ok,status:r.status,data}
}
function modal(title,body,buttons){const close=()=>m.remove();const m=h('div',{class:'mo',onclick:e=>{if(e.target===m)close()}},h('div',{class:'md',role:'dialog','aria-label':title},h('h3',{},title),body,h('div',{class:'fa'},(buttons||[]).map(b=>h('button',{class:'btn '+(b.cls||'ghost'),onclick:async()=>{if(b.fn){const r=await b.fn();if(r===false)return}close()}},b.label)))));document.body.append(m);return close}
const confirmBox=(msg,label,fn)=>modal('Please confirm',h('p',{},msg),[{label:'Cancel'},{label:label||'Delete',cls:'danger',fn}]);
function go(path){history.pushState({},'',path);render()}
addEventListener('popstate',render);
document.addEventListener('click',e=>{const a=e.target.closest('a[data-link]');if(a&&!e.metaKey&&!e.ctrlKey){e.preventDefault();go(a.getAttribute('href'))}});
const slugify=s=>s.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

/* ---------- image picker / media ---------- */
function mediaCard(m,{onPick,reload}){
  const img=h('img',{src:m.url,alt:m.original||m.filename,loading:'lazy'});
  const c=h('div',{class:'mc'+(onPick?' pick':'')},img,h('div',{class:'m'},m.filename,h('br'),(m.width?m.width+'×'+m.height+' · ':'')+Math.round(m.size/1024)+' KB',m.used?' · in use':''));
  if(onPick){c.onclick=()=>onPick(m);return c}
  const file=h('input',{type:'file',accept:'image/jpeg,image/png,image/webp',hidden:true,onchange:async e=>{const f=e.target.files[0];if(!f)return;const r=await api('PUT','/media/'+m.id,undefined,f);toast(r.ok?'Image replaced.':r.data.error,r.ok?'good':'bad');reload()}});
  c.append(h('div',{class:'a'},h('button',{class:'btn ghost sm',onclick:async()=>{try{await navigator.clipboard.writeText(location.origin+m.url);toast('Image URL copied.','good')}catch(_){toast(location.origin+m.url)}}},'Copy URL'),h('button',{class:'btn ghost sm',onclick:()=>file.click()},'Replace'),file,h('button',{class:'btn danger sm',onclick:()=>confirmBox('Delete '+m.filename+'? This cannot be undone.','Delete',async()=>{const r=await api('DELETE','/media/'+m.id);toast(r.ok?'Image deleted.':r.data.error,r.ok?'good':'bad');if(r.ok)reload();else return false})},'Delete')));
  return c;
}
async function uploadFiles(files){let n=0;for(const f of files){const r=await api('PUT','/media?name='+encodeURIComponent(f.name),undefined,f);if(r.ok)n++;else toast(f.name+': '+r.data.error,'bad')}if(n)toast(n+' image'+(n>1?'s':'')+' uploaded.','good');return n}
function pickImage(cb){
  const grid=h('div',{class:'mg'});const q=h('input',{type:'text',placeholder:'Search filename…'});
  const up=h('input',{type:'file',accept:'image/jpeg,image/png,image/webp',multiple:true,hidden:true,onchange:async e=>{await uploadFiles([...e.target.files]);load()}});
  let close;
  async function load(){const r=await api('GET','/media?q='+encodeURIComponent(q.value));grid.replaceChildren(...(r.data.items||[]).map(m=>mediaCard(m,{onPick:x=>{cb(x);close()}})));if(!(r.data.items||[]).length)grid.append(h('p',{},'No images yet. Upload one.'))}
  q.oninput=load;
  close=modal('Choose an image',h('div',{},h('div',{class:'bar'},q,h('button',{class:'btn',onclick:()=>up.click()},'Upload new'),up),grid),[{label:'Close'}]);load();
}

/* ---------- field builders ---------- */
function imgField(f,val){let v=val||'';const prev=h('div',{class:'imgf'});const draw=()=>{prev.replaceChildren(v?h('img',{src:v,alt:''}):h('span',{class:'help'},'No image'),h('button',{type:'button',class:'btn ghost sm',onclick:()=>pickImage(m=>{v=m.url;draw()})},v?'Change':'Choose'),v&&h('button',{type:'button',class:'btn ghost sm',onclick:()=>{v='';draw()}},'Remove'))};draw();return{el:prev,get:()=>v}}
function imgsField(f,val){let v=[...(val||[])];const box=h('div',{class:'imgs'});const draw=()=>{box.replaceChildren(...v.map((s,i)=>h('div',{class:'it'},h('img',{src:s,alt:'',style:'width:84px;height:100px;object-fit:cover'}),h('button',{type:'button','aria-label':'Remove image',onclick:()=>{v.splice(i,1);draw()}},'×'))),h('button',{type:'button',class:'btn ghost sm',onclick:()=>pickImage(m=>{if(v.length<12){v.push(m.url);draw()}})},'+ Add image'))};draw();return{el:box,get:()=>v}}
function blocksField(f,val){
  let v=JSON.parse(JSON.stringify(val||[]));const box=h('div');
  const draw=()=>{box.replaceChildren(...v.map((b,i)=>{
    const type=h('select',{onchange:e=>{const t=e.target.value;v[i]=t==='ul'?{type:t,items:[]}:t==='img'?{type:t,src:'',alt:''}:{type:t,text:b.text||''};draw()}},[['h','Heading'],['p','Paragraph'],['ul','List'],['img','Image']].map(([k,l])=>h('option',{value:k,selected:b.type===k},l)));
    let body;
    if(b.type==='img'){body=h('div',{class:'imgf'},b.src&&h('img',{src:b.src,alt:''}),h('button',{type:'button',class:'btn ghost sm',onclick:()=>pickImage(m=>{b.src=m.url;draw()})},b.src?'Change image':'Choose image'),h('input',{type:'text',placeholder:'Describe the image (alt text)',value:b.alt||'',oninput:e=>b.alt=e.target.value,style:'flex:1;min-width:200px'}))}
    else if(b.type==='ul'){body=h('textarea',{placeholder:'One list item per line',oninput:e=>b.items=e.target.value.split('\n')},(b.items||[]).join('\n'))}
    else body=h('textarea',{placeholder:b.type==='h'?'Heading':'Paragraph. Use **bold**, *italic* and [link text](https://…)',oninput:e=>b.text=e.target.value,style:b.type==='h'?'min-height:46px':''},b.text||'');
    return h('div',{class:'blk'},h('div',{class:'row'},type,h('button',{type:'button',class:'btn ghost sm',onclick:()=>{if(i>0){[v[i-1],v[i]]=[v[i],v[i-1]];draw()}}},'↑'),h('button',{type:'button',class:'btn ghost sm',onclick:()=>{if(i<v.length-1){[v[i+1],v[i]]=[v[i],v[i+1]];draw()}}},'↓'),h('button',{type:'button',class:'btn danger sm',onclick:()=>{v.splice(i,1);draw()}},'Remove')),body)}),
    h('div',{class:'row',style:'display:flex;gap:8px;flex-wrap:wrap'},[['h','+ Heading'],['p','+ Paragraph'],['ul','+ List'],['img','+ Image']].map(([t,l])=>h('button',{type:'button',class:'btn ghost sm',onclick:()=>{v.push(t==='ul'?{type:t,items:[]}:t==='img'?{type:t,src:'',alt:''}:{type:t,text:''});draw()}},l))))};
  draw();return{el:box,get:()=>v,preview:()=>renderBlocks(v)}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rich(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*|mailto:[^\s)]+)\)/g,'<a href="$2" rel="noopener noreferrer">$1</a>')}
function renderBlocks(bl){const d=h('div',{class:'prev'});d.innerHTML=bl.map(b=>b.type==='h'?'<h2>'+rich(b.text||'')+'</h2>':b.type==='p'?'<p>'+rich(b.text||'')+'</p>':b.type==='ul'?'<ul>'+(b.items||[]).filter(Boolean).map(i=>'<li>'+rich(i)+'</li>').join('')+'</ul>':b.src?'<img src="'+esc(b.src)+'" alt="'+esc(b.alt||'')+'">':'').join('');return d}
function buildField(f,val,ctx){
  let get,el,input;
  if(f.t==='img'){const r=imgField(f,val);el=r.el;get=r.get}
  else if(f.t==='imgs'){const r=imgsField(f,val);el=r.el;get=r.get}
  else if(f.t==='blocks'){const r=blocksField(f,val);el=r.el;get=r.get;ctx.blocks=r}
  else if(f.t==='bool'){input=h('input',{type:'checkbox',id:'f_'+f.k,checked:!!val});el=h('div',{class:'sw'},input,h('span',{},f.sw||'Enabled'));get=()=>input.checked}
  else if(f.t==='area'){input=h('textarea',{id:'f_'+f.k,maxlength:f.max,style:f.rows?`min-height:${f.rows*24}px`:''},val||'');el=input;get=()=>input.value}
  else if(f.t==='select'){input=h('select',{id:'f_'+f.k},f.opts.map(o=>h('option',{value:o.v,selected:String(o.v)===String(val??'')},o.l)));el=input;get=()=>input.value}
  else if(f.t==='tags'){input=h('input',{type:'text',id:'f_'+f.k,value:(val||[]).join(', '),placeholder:f.ph||''});el=input;get=()=>input.value.split(',').map(s=>s.trim()).filter(Boolean)}
  else if(f.t==='color'){input=h('input',{type:'color',id:'f_'+f.k,value:val||'#000000',style:'width:64px;height:40px;padding:2px'});el=input;get=()=>input.value}
  else if(f.t==='date'){const l=val?new Date(new Date(val).getTime()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';input=h('input',{type:'datetime-local',id:'f_'+f.k,value:l});el=input;get=()=>input.value?new Date(input.value).toISOString():''}
  else{input=h('input',{type:f.t==='num'?'number':'text',id:'f_'+f.k,value:val??'',step:f.t==='num'?'any':null,min:f.t==='num'?0:null,maxlength:f.max,placeholder:f.ph||''});el=input;get=()=>input.value}
  const err=h('div',{class:'err',id:'e_'+f.k});
  const box=h('div',{class:'fld'+(f.full||['area','blocks','imgs'].includes(f.t)?' full':'')},h('label',{for:'f_'+f.k},f.l+(f.req?' *':'')),el,f.help&&h('div',{class:'help'},f.help),err);
  return{box,get,input,err}
}
function buildForm(fields,data,ctx){const built={};const grid=h('div',{class:'f'});for(const f of fields){built[f.k]=buildField(f,data[f.k],ctx||{});grid.append(built[f.k].box)}
  const collect=()=>Object.fromEntries(fields.map(f=>[f.k,built[f.k].get()]));
  const showErr=fe=>{for(const f of fields){const b=built[f.k];b.err.textContent=(fe&&fe[f.k])||'';if(b.input)b.input.classList.toggle('bad',!!(fe&&fe[f.k]))}const first=Object.keys(fe||{})[0];if(first&&built[first]){built[first].box.scrollIntoView({block:'center'});}};
  return{grid,built,collect,showErr}}
const STAT=[{v:'draft',l:'Draft'},{v:'published',l:'Published'},{v:'archived',l:'Archived'}];

/* ---------- shell ---------- */

/* ---------- router ---------- */
async function render(){
  const p=location.pathname.replace(/\/+$/,'')||'/admin';let m;
  const me=await api('GET','/me');
  if(p==='/admin/login'){if(me.ok)return go('/admin');return loginView()}
  if(!me.ok)return go('/admin/login');
  if(p==='/admin')return dashView();
  if((m=p.match(/^\/admin\/(products|collections|categories|blogs)$/))){const key=m[1]==='blogs'?'posts':m[1];return listView(LIST[key])}
  if((m=p.match(/^\/admin\/(products|collections|categories|blogs)\/(new|\d+)$/))){return formView(m[1]==='blogs'?'posts':m[1],m[2])}
  if(p==='/admin/homepage')return kvView('homepage','Homepage',['homepage','homepage2']);
  if(p==='/admin/pages/about')return kvView('about','About Us Page',['about']);
  if(p==='/admin/settings')return kvView('settings','Website Settings',['settings']);
  if(p==='/admin/settings/security')return securityView();
  if(p==='/admin/media')return mediaView();
  if(p==='/admin/messages')return messagesView();
  mount(shell([['Not found']],h('div',{class:'empty'},'Page not found.')));
}
